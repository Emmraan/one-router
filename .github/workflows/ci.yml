name: CI

on:
  push:
    branches:
      - main
      - 'phase-*'
      - 'feat-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: node scripts/ci-run.mjs pnpm lint

      - name: Typecheck
        run: node scripts/ci-run.mjs pnpm typecheck

      - name: Test
        run: node scripts/ci-run.mjs pnpm test

      - name: Build
        run: node scripts/ci-run.mjs pnpm build

      - name: Budget
        run: node scripts/ci-run.mjs pnpm budget

      - name: Audit gate
        run: node scripts/ci-run.mjs pnpm audit:gate

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-node-${{ matrix.node }}
          path: .ci-logs
          if-no-files-found: ignore

  integration:
    name: Integration (temp libSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: node scripts/ci-run.mjs pnpm test:integration

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: .ci-logs
          if-no-files-found: ignore

  e2e-local:
    name: E2E (static export + Hono)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @one-router/web exec playwright install --with-deps chromium

      - name: Build static export
        run: node scripts/ci-run.mjs pnpm build

      - name: E2E
        run: node scripts/ci-run.mjs pnpm --filter @one-router/web e2e

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            .ci-logs
            apps/web/test-results
          if-no-files-found: ignore

  budget-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm budget

  visual:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @one-router/web exec playwright install chromium
      - run: pnpm build
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures
          path: apps/web/test-results
