name: Scratch Phase 0

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/scratch-phase-0.yml'

permissions:
  contents: read

concurrency:
  group: scratch-phase-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: node scripts/ci-run.mjs pnpm lint

      - name: Typecheck
        run: node scripts/ci-run.mjs pnpm typecheck

      - name: Test
        run: node scripts/ci-run.mjs pnpm test

      - name: Build
        run: node scripts/ci-run.mjs pnpm build

      - name: Budget
        run: node scripts/ci-run.mjs pnpm budget

      - name: Audit gate
        run: node scripts/ci-run.mjs pnpm audit:gate

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-node-24
          path: .ci-logs
          if-no-files-found: ignore
