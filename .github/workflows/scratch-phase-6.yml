name: Phase 6 visual and client budgets

on:
  workflow_dispatch:
  push:
    branches: [phase-6-redesign]
    paths:
      - 'apps/web/**'
      - 'apps/site/**'
      - 'packages/ui/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scratch-phase-6.yml'

permissions:
  contents: read

concurrency:
  group: phase-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm budget
  visual:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @one-router/web exec playwright install chromium
      - run: pnpm build
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures
          path: apps/web/test-results
