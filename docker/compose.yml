services:
  one-router:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - one-router-data:/data
    env_file:
      - .env
    restart: unless-stopped

  minio:
    profiles: [minio]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in docker/.env}"
        : "$${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in docker/.env}"
        exec /usr/bin/docker-entrypoint.sh "$$@"
      - minio-entrypoint
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  one-router-data:
    name: one-router-data
  minio-data:
